name: ShellCheck

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run ShellCheck
        run: |
          shellcheck --version
          # Fail on warnings and above; informational hints stay advisory.
          find .mise/tasks -type f -print0 \
            | xargs -0 shellcheck --external-sources --severity=warning --shell=bash
