name: CI

# For detailed documentation on how to manage and use these test assets, see:
# https://github.com/kiarina/test-assets

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Install mise (required to run the download script)
      - name: Install mise
        uses: jdx/mise-action@v4

      # Restore assets cache if available
      - name: Cache test assets
        id: cache-assets
        uses: actions/cache@v6
        with:
          path: tests/assets
          # Increment r1 whenever files are appended to this asset version.
          key: test-assets-v1-kiarina-python-v1-r1

      # Download and extract assets using the automated script
      - name: Download test assets
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: mise run test-assets:download v1 kiarina-python v1

      # Run your actual tests here
      - name: Run tests
        run: |
          echo "Running tests with assets..."
          # Example: pytest --assets-path tests/assets
          ls -la tests/assets/ || true
